<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#f6f5f2;
    --card:#ffffff;
    --ink:#20242b;
    --muted:#767c88;
    --line:#ececea;
    --accent:#2f9e44;
    --accent-soft:#eaf6ec;
    --shadow: 0 1px 2px rgba(20,20,20,.04), 0 6px 20px rgba(20,20,20,.05);
    --radius: 16px;
  }
  * { box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 80px;
    -webkit-font-smoothing:antialiased;
  }

  /* Header */
  header{
    position:sticky; top:0; z-index:20;
    background: rgba(246,245,242,.92);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line);
    padding: 14px 16px 12px;
  }
  .header-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    max-width:720px; margin:0 auto;
  }
  h1{
    font-size:20px; margin:0; display:flex; align-items:center; gap:8px; letter-spacing:-.2px;
  }
  .badge{
    background:var(--accent); color:white; font-size:13px; font-weight:700;
    border-radius:999px; padding:3px 10px; min-width:24px; text-align:center;
  }
  .badge.zero{ background:#c7cbd1; }

  .controls{
    max-width:720px; margin:10px auto 0; display:flex; gap:8px; align-items:center;
  }
  .search-wrap{ position:relative; flex:1; }
  .search-wrap input{
    width:100%; padding:10px 14px 10px 34px; border-radius:12px; border:1px solid var(--line);
    background:var(--card); font-size:15px; color:var(--ink); outline:none;
  }
  .search-wrap input:focus{ border-color:var(--accent); }
  .search-wrap svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.45; }

  .toggle-btn{
    display:flex; align-items:center; gap:6px; white-space:nowrap;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .toggle-btn.active{ background:var(--accent); border-color:var(--accent); color:white; }

  main{ max-width:720px; margin:14px auto 0; padding:0 16px; }

  .empty-state{
    text-align:center; color:var(--muted); padding:60px 20px; font-size:15px;
  }
  .empty-state .big{ font-size:40px; display:block; margin-bottom:10px;}

  .category{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    margin-bottom:14px; overflow:hidden; border:1px solid var(--line);
  }
  .category-header{
    display:flex; align-items:center; gap:10px; padding:13px 16px; cursor:pointer;
    user-select:none;
  }
  .category-header .cat-emoji{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:18px; flex:none;
  }
  .category-header .cat-name{ font-weight:700; font-size:15.5px; flex:1; }
  .category-header .cat-count{ font-size:12.5px; color:var(--muted); font-weight:600; }
  .category-header .chevron{ color:var(--muted); transition:transform .15s ease; flex:none; }
  .category.collapsed .chevron{ transform:rotate(-90deg); }
  .category.collapsed .cat-body{ display:none; }

  .cat-body{ border-top:1px solid var(--line); }
  .sub-label{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:700; padding:10px 16px 4px;
  }

  .item{
    display:flex; align-items:center; gap:12px; padding:10px 16px;
    border-top:1px solid var(--line);
  }
  .item:first-of-type{ border-top:none; }
  .sub-label + .item{ border-top:none; }

  .item .emoji{ font-size:20px; width:26px; text-align:center; flex:none; display:flex; align-items:center; justify-content:center; }
  .item .emoji svg{ width:22px; height:22px; display:block; }
  .item .name{ flex:1; font-size:15px; }
  .item.checked .name{ color:var(--muted); text-decoration:line-through; text-decoration-color:#c6c9ce; }
  .item.checked .emoji{ opacity:.55; }

  .checkbox{
    width:23px; height:23px; border-radius:7px; border:2px solid #cfd3d9; flex:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:white; transition: all .12s ease;
  }
  .checkbox svg{ opacity:0; transform:scale(.5); transition: all .12s ease; }
  .item.checked .checkbox{ background:var(--accent); border-color:var(--accent); }
  .item.checked .checkbox svg{ opacity:1; transform:scale(1); }

  .item .remove-btn{
    flex:none; color:var(--muted); background:none; border:none; font-size:18px; cursor:pointer; padding:2px 4px;
  }

  .add-btn{
    flex:none; border:1.5px solid var(--accent); color:var(--accent); background:white;
    border-radius:20px; padding:6px 14px; font-size:13.5px; font-weight:700; cursor:pointer;
    transition: all .12s ease; display:flex; align-items:center; gap:5px;
  }
  .add-btn.added{ background:var(--accent); color:white; }

  /* Add item bar */
  .add-bar{
    max-width:720px; margin:6px auto 0; padding:0 16px;
  }
  .add-form{
    display:flex; gap:8px; background:var(--card); border:1px dashed #d5d9de; border-radius:14px; padding:8px;
  }
  .add-form input{
    flex:1; border:none; outline:none; font-size:15px; padding:8px 10px; background:transparent; color:var(--ink);
  }
  .add-form button{
    background:var(--accent); color:white; border:none; border-radius:10px; padding:0 16px;
    font-weight:700; font-size:14px; cursor:pointer;
  }

  footer{
    max-width:720px; margin:22px auto 0; padding:0 16px; display:flex; justify-content:space-between;
    align-items:center; color:var(--muted); font-size:12.5px;
  }
  footer button{
    background:none; border:none; color:#c0392b; font-size:13px; font-weight:600; cursor:pointer; padding:6px 0;
  }

  ::selection{ background:#cdeed4; }
</style>
</head>
<body>

<header>
  <div class="header-row">

  </div>
  <div class="controls">

      <input id="search" type="text" placeholder="Search items…" autocomplete="off">
    </div>
  </div>
</header>

<main id="app"></main>

<div class="add-bar">

</div>

/* ---------- Persistence ---------- */
const INLIST_KEY = 'groceries.checked.v1'; // items on "my list" (kept old storage key so existing data carries over)
const STRUCK_KEY = 'groceries.struck.v1';  // items checked off (bought) within my list
const CUSTOM_KEY = 'groceries.custom.v1';
const COLLAPSE_KEY = 'groceries.collapsed.v1';

function slug(name){ return name.trim().toLowerCase(); }

function loadInList(){
  try { return JSON.parse(localStorage.getItem(INLIST_KEY)) || {}; } catch(e){ return {}; }
}
function saveInList(obj){ localStorage.setItem(INLIST_KEY, JSON.stringify(obj)); }

function loadStruck(){
  try { return JSON.parse(localStorage.getItem(STRUCK_KEY)) || {}; } catch(e){ return {}; }
}
function saveStruck(obj){ localStorage.setItem(STRUCK_KEY, JSON.stringify(obj)); }

function loadCustom(){
  try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || []; } catch(e){ return []; }
}
function saveCustom(arr){ localStorage.setItem(CUSTOM_KEY, JSON.stringify(arr)); }

function loadCollapsed(){
  try { return JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || {}; } catch(e){ return {}; }
}
function saveCollapsed(obj){ localStorage.setItem(COLLAPSE_KEY, JSON.stringify(obj)); }

let inList = loadInList();
let struck = loadStruck();
let custom = loadCustom(); // [{n, e, c:'custom'}]
let collapsed = loadCollapsed();
let myListOnly = false;
let query = '';

const CUSTOM_CATEGORY = { key:'custom', label:'Added by you', emoji:'✨', color:'#f5f0ff', accent:'#7048e8' };

function allItems(){
  return ITEMS.concat(custom.map(c => ({...c, custom:true})));
}

/* ---------- Rendering ---------- */
const app = document.getElementById('app');
const countBadge = document.getElementById('countBadge');

function render(){
  const items = allItems();
  const q = query.trim().toLowerCase();

  const cats = CATEGORIES.concat(custom.length ? [CUSTOM_CATEGORY] : []);
  let html = '';
  let totalInList = 0;
  for (const key in inList) if (inList[key]) totalInList++;

  let anyRendered = false;

  cats.forEach(cat => {
    let catItems = items.filter(it => it.c === cat.key);
    if (q) catItems = catItems.filter(it => it.n.toLowerCase().includes(q));
    if (myListOnly) catItems = catItems.filter(it => inList[slug(it.n)]);
    if (!catItems.length) return;

    anyRendered = true;
    const catCount = myListOnly
      ? catItems.filter(it => struck[slug(it.n)]).length
      : catItems.filter(it => inList[slug(it.n)]).length;
    const isCollapsed = !!collapsed[cat.key];

    // group by subcategory, preserving first-seen order, no-subcat first
    const groups = new Map();
    catItems.forEach(it => {
      const g = it.s || '';
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(it);
    });

    let bodyHtml = '';
    groups.forEach((its, g) => {
      if (g) bodyHtml += `<div class="sub-label">${g}</div>`;
      its.forEach(it => {
        const key = slug(it.n);
        const inMyList = !!inList[key];
        const isStruck = !!struck[key];

        if (myListOnly) {
          bodyHtml += `
            <div class="item ${isStruck?'checked':''}" data-key="${escapeAttr(key)}">
              <div class="checkbox" role="checkbox" aria-checked="${isStruck}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <div class="emoji">${ICONS[key] || it.e}</div>
              <div class="name">${escapeHtml(it.n)}</div>
              <button class="remove-btn" data-remove="${escapeAttr(key)}" aria-label="Remove from list">✕</button>
            </div>`;
        } else {
          bodyHtml += `
            <div class="item ${it.custom?'custom':''}" data-key="${escapeAttr(key)}">
              <div class="emoji">${ICONS[key] || it.e}</div>
              <div class="name">${escapeHtml(it.n)}</div>
              <button class="add-btn ${inMyList?'added':''}" data-add="${escapeAttr(key)}">${inMyList ? '✓ Added' : 'Add'}</button>
            </div>`;
        }
      });
    });

    html += `
      <div class="category ${isCollapsed?'collapsed':''}" data-cat="${cat.key}">
        <div class="category-header">
          <div class="cat-emoji" style="background:${cat.color}">${cat.emoji}</div>
          <div class="cat-name">${cat.label}</div>
          <div class="cat-count">${catCount}/${catItems.length}</div>
          <div class="chevron">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="cat-body">${bodyHtml}</div>
      </div>`;
  });

  if (!anyRendered) {
    html = `<div class="empty-state"><span class="big">${myListOnly ? '🧺' : '🔍'}</span>${
      myListOnly ? "Your list is empty.<br>Add things from All items." : "No items match your search."
    }</div>`;
  }

  app.innerHTML = html;
  countBadge.textContent = totalInList;
  countBadge.classList.toggle('zero', totalInList === 0);

  attachHandlers();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function attachHandlers(){
  document.querySelectorAll('.category-header').forEach(h => {
    h.addEventListener('click', () => {
      const catEl = h.closest('.category');
      const key = catEl.dataset.cat;
      collapsed[key] = !collapsed[key];
      saveCollapsed(collapsed);
      catEl.classList.toggle('collapsed');
    });
  });

  if (myListOnly) {
    // My list: clicking a row toggles whether it's checked off (struck through)
    document.querySelectorAll('.item').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('.remove-btn')) return;
        const key = row.dataset.key;
        struck[key] = !struck[key];
        saveStruck(struck);
        render();
      });
    });

    // Remove from list entirely (doesn't affect All items catalog, except custom items are deleted)
    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = btn.dataset.remove;
        removeFromList(key);
        render();
      });
    });
  } else {
    // All items: clicking Add toggles whether the item is on "my list"
    document.querySelectorAll('.add-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = btn.dataset.add;
        if (inList[key]) {
          removeFromList(key);
        } else {
          inList[key] = true;
          saveInList(inList);
        }
        render();
      });
    });
  }
}

function removeFromList(key){
  delete inList[key];
  saveInList(inList);
  delete struck[key];
  saveStruck(struck);
  // custom items only exist for the sake of being on the list — drop them entirely
  if (custom.some(c => slug(c.n) === key)) {
    custom = custom.filter(c => slug(c.n) !== key);
    saveCustom(custom);
  }
}

/* ---------- Controls ---------- */
document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value;
  render();
});

const listToggleBtn = document.getElementById('listToggle');
listToggleBtn.addEventListener('click', () => {
  myListOnly = !myListOnly;
  listToggleBtn.classList.toggle('active', myListOnly);
  listToggleBtn.textContent = myListOnly ? 'All items' : 'My list';
  render();
});

document.getElementById('addForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('addInput');
  const name = input.value.trim();
  if (!name) return;
  const key = slug(name);
  const exists = allItems().some(it => slug(it.n) === key);
  if (!exists) {
    custom.push({ n: name, e: '🛒', c: 'custom' });
    saveCustom(custom);
  }
  inList[key] = true;
  saveInList(inList);
  input.value = '';
  render();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  const struckKeys = Object.keys(struck).filter(k => struck[k]);
  if (!struckKeys.length) return;
  if (confirm('Remove checked-off items from your list?')) {
    struckKeys.forEach(removeFromList);
    render();
  }
});

render();
</script>
</body>
</html>
